name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pinned linters (versions live in the Makefile)
        run: |
          make install-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Test (race)
        run: make race

      - name: Coverage floor (result-producing packages)
        run: make cover

      - name: Build
        run: make build

  # Separate from `make lint` on purpose: kubeconform downloads the Kubernetes
  # schemas and `docker compose config` needs the Docker CLI (see the Makefile).
  deploy:
    name: Deploy manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install pinned kubeconform (version lives in the Makefile)
        run: |
          make install-kubeconform
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: kubeconform + docker compose config
        run: make lint-deploy

  # PRs build the image and run it; pushes to main also publish it. Gated on
  # the other jobs so a published image always passed lint and tests.
  image:
    name: Image
    runs-on: ubuntu-24.04
    needs: [lint, test, deploy]
    permissions:
      contents: read
      packages: write # GHCR push with GITHUB_TOKEN; this job only
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wrbooth/vllm-serve-bench
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load into the runner's Docker)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vllm-serve-bench:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (the binary starts and carries the commit)
        run: |
          got=$(docker run --rm vllm-serve-bench:ci version)
          echo "bench version: $got"
          test "$got" = "$GITHUB_SHA"

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (:<sha>, :latest)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
