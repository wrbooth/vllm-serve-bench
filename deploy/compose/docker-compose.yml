# The engine as it actually runs for every reported number. Start it through
# ./engine.sh, which layers the env files in a fixed order (see there); a bare
# `docker compose up` leaves MODEL and ENGINE_ARGS unset on purpose, and fails.
#
# The bench service is behind the `bench` profile, so `docker compose up` (and
# engine.sh) still starts only the engine. See the service for how to run it.
name: vllm-serve-bench

services:
  vllm:
    image: ${VLLM_IMAGE:?set in .env}
    container_name: vsb-vllm
    # The image's entrypoint is `vllm serve`; the model is positional (v0.29
    # warns that `--model` is deprecated). A string command is split
    # shell-style, so ENGINE_ARGS (one experiment's flags) expands to argv.
    # ENGINE_ARGS comes last: vLLM keeps the last occurrence of a repeated flag,
    # so nothing may be appended after it. engine.sh records the argv that
    # actually ran, not this line.
    command: >-
      ${MODEL:?set by engine.sh} --host 0.0.0.0 --port 8000 ${ENGINE_ARGS?set by engine/<config>.env}
    devices:
      # NixOS host: CDI spec from nvidia-container-toolkit, no `nvidia` runtime
      # registered, so `gpus:` / `--gpus` would not work (wiki/gpu-host.md).
      # A CDI device is named directly, the Compose spelling of
      # `docker run --device nvidia.com/gpu=all`.
      - nvidia.com/gpu=all
    environment:
      HF_HUB_OFFLINE: "1" # weights come from the host cache only; never a surprise download mid-run
      # Registers vLLM's dev endpoints, of which the bench uses one:
      # POST /reset_prefix_cache before every level, so no prompt from an
      # earlier run is served from cache. vLLM's own sweep tool
      # (vllm/benchmarks/sweep/server.py) runs its server the same way. In
      # v0.29 the flag does nothing else except log stack traces on errors,
      # and it is excluded from the compile-cache hash (envs.py).
      # Localhost-only port.
      VLLM_SERVER_DEV_MODE: ${VLLM_SERVER_DEV_MODE:-1}
    volumes:
      - ${HF_CACHE:?set in .env.local}:/root/.cache/huggingface:ro
      # Checkpoints made here (B2's FP8 model), served as /models/<name>.
      - ${MODELS_DIR:?set in .env.local}:/models:ro
      - vllm-cache:/root/.cache/vllm # torch.compile / CUDA graph cache; survives restarts
    shm_size: 8gb
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000" # the bench runs on this host; nothing on the LAN
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15m # 7B load + compile on a cold cache

  # One sweep of one profile against the running engine, from our image. With
  # the engine already up through engine.sh (same env files, same order):
  #
  #   ENGINE_ARGV="$(./engine.sh argv)" BENCH_PROFILE=interactive \
  #     docker compose --env-file .env --env-file engine/<config>.env \
  #     --env-file .env.local --profile bench run --rm bench
  #
  # The bench cannot read the engine's /proc/1/cmdline from its own container,
  # so the caller passes the argv engine.sh reads; bench run refuses to start
  # without it. scripts/sweep.sh is the same sweep from a host binary.
  bench:
    profiles: [bench]
    image: ${BENCH_IMAGE:-ghcr.io/wrbooth/vllm-serve-bench:latest}
    depends_on:
      vllm:
        condition: service_healthy
    # List form: each element is one argv entry, so ENGINE_ARGV keeps its spaces.
    command:
      - run
      - --profile
      - ${BENCH_PROFILE:-interactive}
      - --warmup
      - 10s
      - --duration
      - 60s
      - --seed
      - "1"
      # Service name on the Compose network: same host, no LAN hop in TTFT.
      - --base-url
      - http://vllm:8000
      - --model
      - ${MODEL:?set by engine.sh}
      - --out
      - /results/${RESULTS_SUBDIR:-tmp}
      - --engine-config
      - ${CONFIG:-baseline}
      - --engine-argv
      - ${ENGINE_ARGV:-}
      - --engine-image
      - ${VLLM_IMAGE:?set in .env}
    devices:
      # Only for nvidia-smi (the 1 Hz GPU sampler): the CDI spec mounts the
      # binary and NVML into the container. The bench allocates no GPU memory.
      # Without this device, add --gpu-sampler=false to the command.
      - nvidia.com/gpu=all
    # The image runs as distroless nonroot (65532); the bind mount must be
    # writable by this uid. Set BENCH_UID/BENCH_GID in .env.local to the owner
    # of the results directory.
    user: "${BENCH_UID:-65532}:${BENCH_GID:-65532}"
    volumes:
      - ${RESULTS_DIR:-../../results}:/results

volumes:
  vllm-cache:
