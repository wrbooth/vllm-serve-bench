# What the bench records about the engine (config.json). ENGINE_ARGV here is
# the argv the Deployment DECLARES under the image's entrypoint, not one read
# from the pod. Before a run that will be reported, replace it with the pod's
# actual argv (deploy/k8s/README.md shows the one-liner), the same rule as
# `engine.sh argv` in Compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-engine
  namespace: vllm-serve-bench
  labels:
    app.kubernetes.io/name: bench
    app.kubernetes.io/component: loadgen
    app.kubernetes.io/part-of: vllm-serve-bench
data:
  ENGINE_CONFIG: baseline
  MODEL: Qwen/Qwen2.5-7B-Instruct
  ENGINE_IMAGE: vllm/vllm-openai:v0.29.0@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
  ENGINE_ARGV: >-
    /usr/bin/python3 /usr/local/bin/vllm serve Qwen/Qwen2.5-7B-Instruct --host 0.0.0.0 --port 8000
    --gpu-memory-utilization 0.90 --max-model-len 8192 --max-num-seqs 256 --max-num-batched-tokens 2048
