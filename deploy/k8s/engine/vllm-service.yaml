apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: vllm-serve-bench
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: engine
    app.kubernetes.io/part-of: vllm-serve-bench
spec:
  type: ClusterIP # in-cluster only, as the Compose port is localhost-only
  selector:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: engine
  ports:
    - name: http
      port: 8000
      targetPort: http
